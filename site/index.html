function predRankACast(host){
  const M=_predBuckets();
  host.append(predDisclaimer());
  const ctrl=el('div',{class:'controls'});
  const frS=el('select',{});FRANCHISES.forEach(f=>frS.append(el('option',{value:f},f)));
  const seS=el('select',{});
  ctrl.append(el('span',{style:'font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--gold)'},'Franchise'),frS,
    el('span',{style:'font-size:11px;letter-spacing:2px;text-transform:uppercase;color:var(--gold)'},'Season'),seS);
  host.append(ctrl);
  const out=el('div',{class:'fade'});host.append(out);
  const fillSeasons=()=>{seS.innerHTML='';
    D.seasons.filter(s=>s.franchise===frS.value).forEach(s=>seS.append(el('option',{value:s.season_id},s.season_label)));
    draw();};
  const draw=()=>{
    const sid=seS.value;out.innerHTML='';
    const cast=masterRows().filter(r=>r.season===sid);
    if(!cast.length){out.append(el('div',{class:'card empty'},'No cast on file for that season.'));return;}
    const castSize={};castSize[sid]=cast.length;
    const scored=cast.map(r=>{const res=predScore(predValsFromRow(r,castSize));
      return {queen:r.queen,queen_id:r.queen_id,score:res.score,placement:+r.placement||null,image:r.image};})
      .sort((a,b)=>b.score-a.score);
    scored.forEach((r,i)=>r.predRank=i+1);
    const hasWinner=scored.some(r=>r.placement===1);
    // model fit: Spearman-ish — does predicted order track actual placement?
    const withPlace=scored.filter(r=>r.placement);
    let hits=0,pairs=0;
    for(let a=0;a<withPlace.length;a++)for(let b=a+1;b<withPlace.length;b++){pairs++;
      const pa=withPlace[a],pb=withPlace[b];
      // predRank a<b means model favors a; concordant if actual placement agrees (lower placement = better)
      if((pa.predRank<pb.predRank)===(pa.placement<pb.placement))hits++;}
    const concord=pairs?Math.round(100*hits/pairs):null;
    const top=scored[0];
    statCards(out,[[top.queen,'model’s pick'],[top.score,'top vibe score'],
      [hasWinner?(scored.find(r=>r.placement===1)||{}).predRank+' / '+scored.length:'in progress','actual winner’s vibe rank'],
      [concord!=null?concord+'%':'—','order agreement']]);
    if(!hasWinner)out.append(el('div',{class:'pill gold',style:'margin-bottom:10px'},'No crowned winner yet — actual column shows current placements where known.'));
    const card=el('div',{class:'card fade'});
    card.append(sectionHead('Predicted vibe rank vs actual placement','var(--magenta)'));
    const t=el('table',{style:'font-size:13px'});
    t.append(el('tr',{},el('th',{},'Vibe rank'),el('th',{},'Queen'),el('th',{},'Vibe score'),el('th',{},'Actual place'),el('th',{},'Verdict')));
    scored.forEach(r=>{const tr=el('tr',{style:'cursor:pointer'});
      tr.addEventListener('click',()=>go('queen:'+r.queen_id));
      let verdict='—',vc='rgba(247,240,230,.6)';
      if(r.placement){const diff=r.placement-r.predRank;
        if(r.placement===1&&r.predRank===1){verdict='called it ✦';vc='var(--mint)';}
        else if(Math.abs(diff)<=1){verdict='close';vc='var(--gold)';}
        else if(diff>0){verdict='model overrated';vc='var(--rose)';}
        else{verdict='model slept on her';vc='var(--mint)';}}
      tr.append(el('td',{style:'color:var(--gold)'},'#'+r.predRank),
        el('td',{},qname[r.queen_id]||r.queen),
        el('td',{style:'font-weight:700'},String(r.score)),
        el('td',{},r.placement?'#'+r.placement:'—'),
        el('td',{style:'color:'+vc},verdict));
      t.append(tr);});
    card.append(el('div',{style:'overflow-x:auto'},t));
    card.append(el('div',{style:'font-size:11px;color:rgba(247,240,230,.55);margin-top:10px'},
      'Order agreement = share of queen-pairs the model ranks in the same order as their real finish. ~50% is pure chance; '+
      'the model rarely beats that by much, which is the whole point.'));
    out.append(card);
  };
  frS.addEventListener('change',fillSeasons);seS.addEventListener('change',draw);
  fillSeasons();
}

let _navEnsure=null;
function _navState(){try{return JSON.parse(localStorage.getItem('wr-nav')||'{}');}catch(e){return {};}}
function _navSave(s){try{localStorage.setItem('wr-nav',JSON.stringify(s));}catch(e){}}
function buildNav(){
  const nav=$('#nav');nav.innerHTML='';
  nav.append(el('div',{class:'brand',html:'THE <span class="crown">WERK</span>ROOM'}));
  nav.append(el('div',{class:'brand-sub'},'Drag Race Data Observatory'));
  const search=el('input',{class:'navsearch',type:'text',placeholder:'Jump to a view…'});
  nav.append(search);
  const groupWrap=el('div');nav.append(groupWrap);
  const sections={};
  const setOpen=(g,open)=>{const s=sections[g];if(!s)return;
    s.body.style.display=open?'':'none';s.caret.textContent=open?'▾':'▸';};
  /* Build the special "Regions" nav group: items are the regions present in the
     data, in REGION_ORDER, each linking to its #region: landing view, with a live
     season count — mirroring how the other groups show their item counts. The
     active region (route #region:<r>) highlights its item like a .navlink.active.
     Placed right after Home, before Queens. */
  const buildRegionsGroup=(filter,st,activeRegion)=>{
    const regions=regionsPresent();
    const matched=filter?regions.filter(r=>r.toLowerCase().includes(filter.toLowerCase())):regions;
    if(!matched.length)return null;
    const g='Regions';
    const open=filter?true:(st[g]!=null?!!st[g]:(activeRegion!=null));
    const caret=el('span',{class:'ngcaret',title:'Expand / collapse'},open?'▾':'▸');
    const hdr=el('div',{class:'navgrouphead',title:'Browse seasons by region'},
      el('span',{class:'ngi',html:icon('map')}),
      el('span',{class:'ngn'},g),el('span',{class:'ngc'},String(regions.length)),caret);
    const body=el('div',{class:'navgroupbody',style:open?'':'display:none'});
    matched.forEach(r=>{
      const cnt=D.seasons.filter(s=>s.region===r).length;
      const link=el('div',{class:'navlink'+(r===activeRegion?' active':''),'data-region':r,
        onclick:()=>go('region:'+r),
        html:`${icon(r==='Main Series'?'crown':'map')}<span>${r}</span>`});
      link.append(el('span',{class:'ngc',style:'margin-left:auto'},String(cnt)));
      body.append(link);
    });
    caret.addEventListener('click',ev=>{ev.stopPropagation();const s=_navState();
      const now=body.style.display==='none';body.style.display=now?'':'none';caret.textContent=now?'▾':'▸';
      s[g]=now;_navSave(s);});
    /* heading opens the flagship region (Main Series) landing and expands the group */
    hdr.addEventListener('click',()=>{const s=_navState();s[g]=true;_navSave(s);
      body.style.display='';caret.textContent='▾';go('region:'+(regions[0]||'Main Series'));});
    return {hdr,body};
  };
  const render=(filter='')=>{groupWrap.innerHTML='';
    const st=_navState();
    const activeId=(_LAST_ROUTE||'home').split(':')[0];
    const activeRegion=activeId==='region'?resolveRegion(String(_LAST_ROUTE).split(':').slice(1).join(':')):null;
    const av=VIEWS.find(v=>v.id===activeId);const activeGroup=av&&av.group;
    GROUPS.forEach(g=>{
      /* inject the Regions group immediately after Home, before Queens */
      if(g==='Queens'){const rg=buildRegionsGroup(filter,st,activeRegion);if(rg)groupWrap.append(rg.hdr,rg.body);}
      const items=VIEWS.filter(v=>v.group===g&&!v.hidden).sort((a,b)=>(a.ord||0)-(b.ord||0));
      const matched=filter?items.filter(v=>v.title.replace(/<[^>]+>/g,'').toLowerCase().includes(filter.toLowerCase())):items;
      if(!matched.length)return;
      const open=filter?true:(st[g]!=null?!!st[g]:g===activeGroup);
      const caret=el('span',{class:'ngcaret',title:'Expand / collapse'},open?'▾':'▸');
      const hdr=el('div',{class:'navgrouphead','data-slug':GROUP_SLUG[g]||'',title:'Open the '+g+' section page'},
        el('span',{class:'ngi',html:icon(GROUP_ICONS[g]||'star')}),
        el('span',{class:'ngn'},g),el('span',{class:'ngc'},String(items.length)),caret);
      const body=el('div',{class:'navgroupbody',style:open?'':'display:none'});
      matched.forEach(v=>body.append(el('div',{class:'navlink','data-id':v.id,onclick:()=>go(v.id),
        html:`${icon(v.icon)}<span>${v.title.replace(/<[^>]+>/g,'')}</span>`})));
      /* caret = expand/collapse only; heading itself = open the section homepage (and expand) */
      caret.addEventListener('click',ev=>{ev.stopPropagation();const s=_navState();
        const now=body.style.display==='none';setOpen(g,now);s[g]=now;_navSave(s);});
      hdr.addEventListener('click',()=>{const s=_navState();s[g]=true;_navSave(s);setOpen(g,true);
        go('sec:'+(GROUP_SLUG[g]||'home'));});
      sections[g]={body,caret};
      groupWrap.append(hdr,body);
    });
    setActive(activeId);
  };
  search.addEventListener('input',e=>render(e.target.value));render();
  _navEnsure=(id,grp)=>{const v=VIEWS.find(x=>x.id===id);const g=grp||(v&&v.group);
    if(g&&sections[g])setOpen(g,true);};
}
let _LAST_ROUTE=null;
/* old view ids -> their merged survivors (kept alive for trivia links, the Librarian, and old #hashes) */
const ROUTE_ALIASES={georoll:'hometowns',zodiac:'birthdays',safestreaks:'survivors',farewells:'elimorder',
  challengemix:'challenges',snatchhall:'snatch',guestdir:'guestfreq',continuity:'panel',tenure:'panel',
  'sec:home':'home'};

/* ---------------- in-app navigation history ----------------
   NAV_STACK holds the routes the user has VISITED, in order, so the Back
   control can return to the *previous view* — including drill-down routes
   (queen:/season:/celeb:/sec:) that the hash router would otherwise treat
   as one history entry. We use history.replaceState (never pushState) so we
   own a single browser entry and never fight the browser's own history;
   the in-app stack is the single source of truth for "previous view".
   _navSilent suppresses pushing a new entry when a navigation is itself a
   Back action (pop) or a same-route re-render, preventing infinite loops. */
const NAV_STACK=[];
let _navSilent=false;
const HOME_ROUTE='home';
function goBack(){
  if(!NAV_STACK.length)return;
  const prev=NAV_STACK.pop();   // route we are returning to
  _navSilent=true;              // don't re-push it on the way back
  go(prev);
  _navSilent=false;
}
function go(route){
  if(ROUTE_ALIASES[route])route=ROUTE_ALIASES[route];
  // record where we were *before* navigating, so Back can return to it.
  // Skip when this go() is itself a Back pop, a no-op re-render of the
  // current route, or the initial load (_LAST_ROUTE null).
  if(!_navSilent && _LAST_ROUTE && route!==_LAST_ROUTE){
    NAV_STACK.push(_LAST_ROUTE);
    if(NAV_STACK.length>100)NAV_STACK.shift();
  }
  _LAST_ROUTE=route;
  const main=$('#main');main.scrollTop=0;window.scrollTo(0,0);
  let id=route,arg=null;
  if(route.includes(':')){[id,arg]=route.split(':');}
  setActive(id);if(_navEnsure)_navEnsure(id,id==='sec'&&arg?SLUG_GROUP[arg]:null);
  if(id==='region'&&arg){const r=resolveRegion(arg);if(r){renderRegionLanding(main,r);}else{(VIEWS.find(x=>x.id==='atlas')||VIEWS[0]).render(main);}}
  else if(id==='season'&&arg){renderSeasonDetail(main,arg);}
  else if(id==='queen'&&arg){renderQueen(main,arg);}
  else if(id==='celeb'&&arg){renderCeleb(main,arg);}
  else if(id==='sec'&&arg&&SLUG_GROUP[arg]){renderSectionHome(main,SLUG_GROUP[arg]);}
  else{const v=VIEWS.find(x=>x.id===id)||VIEWS[0];v.render(main);}
  // Back control: injected at the top of #main AFTER the view renders (every
  // renderer sets main.innerHTML first, wiping #main, so prepending here is
  // safe for all views and all drill-down routes). Hidden on the home view
  // and whenever there is nothing to go back to.
  if(NAV_STACK.length && route!==HOME_ROUTE){
    const back=el('button',{class:'backbtn',type:'button','aria-label':'Go back to the previous view',
      onclick:goBack},[el('span',{class:'barrow','aria-hidden':'true'},'←'),'Back']);
    const bar=el('div',{class:'backbar fade'},back);
    main.insertBefore(bar,main.firstChild);
  }
  /* persistent scope chip — the single always-visible affordance for the season
     scope on every view (desktop: top of main; mobile: mirrored in the topbar).
     Prepended after the backbar so it always sits first; never in NAV_STACK. */
  main.insertBefore(el('div',{class:'scopebar fade'},scopeChipEl()),main.firstChild);
  updateTopbarChip();
  if(history&&history.replaceState)history.replaceState(null,'','#'+route);
  document.querySelector('aside').classList.remove('open');
  // footer
  const foot=el('div',{class:'foot'});
  foot.append(el('div',{html:'THE WERKROOM · an original, copyright-safe data observatory of the Drag Race universe · built from a hand-verified relational database · no official logos, trade dress, or photographs used'}));
  foot.append(el('div',{style:'margin-top:8px'},'Spot a mistake? ',feedbackFootLink(),'.'));
  foot.append(el('div',{style:'margin-top:8px;opacity:.8'},FAN_DISCLAIMER));
  main.append(foot);
}
window.addEventListener('mousemove',e=>{if(tt.style.opacity==='1')moveTip(e);});
/* embed mode: inside the 3D world's dressing panel (or any iframe / ?embed=1)
   hide the sidebar/topbar/footer chrome and show content-only. self!==top is
   the trigger, so the world's bridgeFrame.src stays untouched. */
try{
  if(window.self!==window.top||new URLSearchParams(location.search).has('embed'))
    document.body.classList.add('embed');
}catch(e){document.body.classList.add('embed');}   /* cross-origin top ⇒ definitely framed */
/* GLAM entrance: one-time curtain-part + spotlight-up over the first render.
   Session-scoped (sessionStorage), skipped entirely in embed mode and under
   prefers-reduced-motion. The overlay is pointer-events:none and removes
   itself in <1s, so content is interactive from the first frame. */
(function(){
  let seen=true;
  try{seen=sessionStorage.getItem('wr-entrance')==='1';}catch(e){}
  if(seen||GLAM.reduced||GLAM.embed())return;
  try{sessionStorage.setItem('wr-entrance','1');}catch(e){return;}
  const c=el('div',{id:'wr-curtain','aria-hidden':'true'},
    el('div',{class:'cpane cl'}),el('div',{class:'cpane cr'}),el('div',{class:'cspot'}));
  document.body.append(c);document.body.classList.add('wr-enter');
  setTimeout(()=>{c.remove();document.body.classList.remove('wr-enter');},980);
})();
buildNav();
go((location.hash||'#home').slice(1));
/* External hash changes (browser/phone back-forward, deep-link edits, manual
   hash typing) route through go(). If the new hash is the route directly
   beneath the top of our in-app stack, treat it as a Back action (pop) so the
   stack stays in sync; otherwise render it as a normal (silent) navigation so
   we never spuriously grow the stack from browser-driven hash changes. */
window.addEventListener('hashchange',()=>{
  let r=(location.hash||'#home').slice(1);
  if(ROUTE_ALIASES[r])r=ROUTE_ALIASES[r];
  if(r===_LAST_ROUTE)return;
  if(NAV_STACK.length && NAV_STACK[NAV_STACK.length-1]===r){goBack();return;}
  _navSilent=true;go(r);_navSilent=false;
});

</script>
