name: validate

# Runs the data-integrity suite on every push and pull request. The build fails
# (red X) if any invariant is broken, so bad data can't be merged.

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate data invariants
        run: python scripts/validate.py

      - name: Verify the site data builds
        run: python scripts/build_site_data.py --check
